name: image2github
description: A Flutter mobile application to browse GitHub repositories and upload images.
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP client for GitHub API
  http: ^1.1.0
  
  # Image picker for selecting images from device
  image_picker: ^1.0.4
  
  # File picker as alternative
  file_picker: ^8.0.0
  
  # UI icons
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4
  app_links: ^6.3.3
  
  # Code syntax highlighting
  flutter_highlight: ^0.7.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21 # optional
  web:
    generate: true
  windows:
    generate: true
